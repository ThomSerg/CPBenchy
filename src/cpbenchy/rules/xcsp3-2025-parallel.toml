name = "xcsp3-2025-parallel"
description = "XCSP3 Competition 2025, parallel COP track: best solution, 4 cores, 30 minutes"
url = "https://arxiv.org/abs/2511.06918"

# The limits as run (proceedings, p. 105); SIGTERM, then SIGKILL one second later (call for solvers,
# https://www.cril.univ-artois.fr/~lecoutre/compets/callXCSP25.pdf).
[settings]
time-limit = 1800           # 30 minutes of wall clock time
mem-limit = 65536           # 64 GiB
cores = 4
terminate = true
grace = 1
plugins = ["cpbenchy.observers:XCSP3Output"]

# How the competition calls a solver: a command line of your choice, with these placeholders
# (`cpbenchy submission` builds a launcher that takes them, in this order). TIMELIMIT: the time limit, here wall clock time.
[interface]
arguments = ["BENCHNAME", "RANDOMSEED", "TIMELIMIT", "MEMLIMIT", "NBCORE", "TMPDIR"]
